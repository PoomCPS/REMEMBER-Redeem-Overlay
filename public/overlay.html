<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REMEMBER Twitch Redeem Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700;800&family=Kanit:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/design/theme.css">
  <link rel="stylesheet" href="overlay.css">
</head>

<body>
  <div class="overlay-container">
    <div id="redeemCard" class="vhs-tape-shell hidden">
      <!-- Tape Top Texture & Screws -->
      <div class="vhs-top-band">
        <span class="vhs-screw"></span>
        <div class="vhs-top-texture"></div>
        <span class="vhs-screw"></span>
      </div>

      <!-- Main Cassette Window & Label -->
      <div class="vhs-main-window">
        <!-- Left Spool Reel -->
        <div class="vhs-spool left-spool">
          <div class="vhs-tape-pack left-pack"></div>
          <div class="vhs-hub-cog">
            <span class="cog-spoke spoke-1"></span>
            <span class="cog-spoke spoke-2"></span>
            <span class="cog-spoke spoke-3"></span>
          </div>
        </div>

        <!-- Center Paper Label Sticker -->
        <div class="vhs-label-sticker">
          <!-- Top Header Stripe -->
          <div class="vhs-label-stripe">
            <span class="vhs-label-brand">T-120 // HI-FI</span>
            <span class="vhs-rec-dot">● REC</span>
          </div>

          <!-- 2 Lines of Clean Content (No emojis, No points) -->
          <div class="vhs-label-lines">
            <!-- Line 1: 1st visitor -->
            <div class="vhs-text-row row-status">
              <span id="indicatorLabel" class="vhs-badge-text">1st visitor</span>
            </div>
            <div class="vhs-rule-line"></div>
            <!-- Line 2: username -->
            <div class="vhs-text-row row-username">
              <span id="viewerName" class="vhs-username-text">Username</span>
            </div>
            <div class="vhs-rule-line"></div>
            <div class="vhs-text-row row-blank"></div>
          </div>
        </div>

        <!-- Right Spool Reel -->
        <div class="vhs-spool right-spool">
          <div class="vhs-tape-pack right-pack"></div>
          <div class="vhs-hub-cog">
            <span class="cog-spoke spoke-1"></span>
            <span class="cog-spoke spoke-2"></span>
            <span class="cog-spoke spoke-3"></span>
          </div>
        </div>
      </div>

      <!-- Bottom Flap / Seam -->
      <div class="vhs-bottom-flap">
        <span class="vhs-screw"></span>
        <div class="vhs-latch left-latch"></div>
        <div class="vhs-bottom-ridge"></div>
        <div class="vhs-latch right-latch"></div>
        <span class="vhs-screw"></span>
      </div>

      <!-- Hidden compatibility hooks for existing script -->
      <div class="hidden-hooks" style="display: none !important;">
        <span id="liveIndicator"></span>
        <span id="rewardTitle"></span>
      </div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>

</html>
