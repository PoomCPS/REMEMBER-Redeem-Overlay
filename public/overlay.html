<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REMEMBER Twitch Redeem Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div class="overlay-container">
    <div id="redeemCard" class="redeem-card hidden">
      <!-- Glow ambient backdrop -->
      <div class="card-glow"></div>
      
      <!-- Content wrapper -->
      <div class="card-content">
        <!-- Top Tag / Header -->
        <div class="card-header">
          <div class="channel-points-badge">
            <svg class="points-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
            </svg>
            <span class="badge-text">CHANNEL POINT REDEEM</span>
          </div>
          <div id="liveIndicator" class="live-indicator">
            <span class="dot"></span>
            <span id="indicatorLabel" class="indicator-label">LATEST</span>
          </div>
        </div>

        <!-- Main Redeeming Viewer Name -->
        <div class="viewer-section">
          <div id="viewerName" class="viewer-name">ViewerName</div>
        </div>

        <!-- Redeemed Reward Title -->
        <div class="reward-section">
          <span class="reward-prefix">Reward:</span>
          <span id="rewardTitle" class="reward-title">Reward Title</span>
        </div>
      </div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
