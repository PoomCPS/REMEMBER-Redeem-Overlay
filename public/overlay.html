<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REMEMBER Twitch Redeem Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700;800&family=Kanit:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/design/theme.css">
  <link rel="stylesheet" href="overlay.css">
</head>

<body>
  <div class="overlay-container">
    <div id="redeemCard" class="redeem-card hidden">
      <!-- 1980s Stepped Analog Stripe Anchor -->
      <div class="tape-stripes-v spine-stripes">
        <span class="stripe stripe-red"></span>
        <span class="stripe stripe-orange"></span>
        <span class="stripe stripe-yellow"></span>
        <span class="stripe stripe-blue"></span>
        <span class="stripe stripe-green"></span>
      </div>

      <!-- Single row content: [ 👑 1ST REDEEM ] @user #แต้มที่แลก -->
      <div class="card-content-row">
        <span id="liveIndicator" class="micro-badge">
          <span id="indicatorLabel" class="badge-text">[ 👑 1ST REDEEM ]</span>
        </span>
        <span class="user-chunk">
          <span class="prefix-at">@</span><span id="viewerName" class="viewer-name">ViewerName</span>
        </span>
        <span class="reward-chunk">
          <span class="prefix-hash">#</span><span id="rewardTitle" class="reward-title">Reward Title</span>
        </span>
      </div>

      <!-- Mechanical Notch Detail -->
      <div class="tape-notch"></div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>

</html>
